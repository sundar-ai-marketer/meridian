# NOTICE: This file was modified from the original google/meridian source.
# See the NOTICE file at the repository root for details.

name: CI  # For unit tests and build

on:
  # `push` is restricted to `main` (rather than `'**'`) so that a branch
  # pushed within this repository does not trigger CI twice -- once for the
  # `push` and once for the `pull_request` opened from it. A push to any
  # other branch still gets CI coverage through the `pull_request` trigger
  # below once a PR is opened; a push to `main` itself (e.g. a merge) is
  # covered here directly.
  push:
    branches:
      - main
  # Gives an external contributor's PR (pushed from their own fork, so no
  # `push` event ever fires in this repository) CI coverage. Restricted to
  # PRs targeting `main`, matching the `push` trigger above.
  pull_request:
    branches:
      - main

# Least-privilege default: only `contents: read` is needed to check out and
# test the code. Jobs that need more (e.g. `publish.yml`'s tag/publish steps)
# declare their own broader `permissions` already and are unaffected by this.
permissions:
  contents: read

env:
  USE_PYTHON_VERSION: "3.11"
  PROTO_DIR: "proto"

jobs:
  # Build meridian "core" and "mmm-proto-schema" distributions.
  build-distributions:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build meridian core distribution
        uses: ./.github/actions/build
        with:
          python_version: ${{ env.USE_PYTHON_VERSION }}
          artifact_name: meridian-core-package-distribution
      - name: Check schema build failure contracts
        run: |
          python -m pip install 'setuptools>=77.0.3'
          python scripts/test_proto_build.py
      - name: Build mmm-proto-schema distribution
        uses: ./.github/actions/build
        with:
          python_version: ${{ env.USE_PYTHON_VERSION }}
          working_directory: ./proto
          output_path: ./proto/dist
          artifact_name: mmm-proto-package-distribution

  # Include for sanity checking that version increment parsing and checking logic works.
  check-version:
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read the literal version module; this metadata gate does not need the
      # scientific stack or an editable package install.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.USE_PYTHON_VERSION }}

      - name: Get meridian version
        id: get_meridian_version
        shell: bash
        run: |
          VERSION=$(python -c "import runpy; print(runpy.run_path('meridian/version.py')['__version__'])")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check meridian version
        id: meridian_version_check
        uses: ./.github/actions/version-check
        with:
          python_version: ${{ env.USE_PYTHON_VERSION }}
          semver_prefix: v
          current_version: ${{ steps.get_meridian_version.outputs.value}}

      - name: Test version-check action contracts
        run: bash .github/actions/version-check/check_version_test.sh

      # Check mmm-proto-schema version
      - name: Get mmm-proto-schema version
        id: get_proto_version
        uses: ./.github/actions/get-proto-version
        with:
          python_version: ${{ env.USE_PYTHON_VERSION }}
      - name: Check mmm-proto-schema version
        uses: ./.github/actions/version-check
        with:
          python_version: ${{ env.USE_PYTHON_VERSION }}
          semver_prefix: proto-v
          current_version: ${{ steps.get_proto_version.outputs.value}}

  # Duplicate code and unused names, on the paths this fork owns. Fast: it
  # needs only the [dev] extra, not the scientific stack, because
  # .pylintrc-gate leaves import-error off.
  lint:
    name: Lint (duplicate code, unused names)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.USE_PYTHON_VERSION }}
      - name: Install pylint
        run: python -m pip install 'pylint>=4.0'
      - name: Run the gated checks
        # `make lint-paths` so the scope has one definition (the Makefile),
        # not a copy here that can drift out of step with it.
        run: python -m pylint --rcfile=.pylintrc-gate --score=n $(make -s lint-paths)

  # AUDIT.md recorded pip-audit and actionlint as run once by hand, which meant
  # a dependency advisory published afterwards, or a workflow edit that broke
  # its own schema, would go unnoticed until someone re-ran them. Both are
  # cheap, so both run here. Kept as a separate job: an advisory against a
  # pinned dependency is a real finding, and it should be visible without
  # taking the whole test matrix down with it.
  security:
    name: Advisories and workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.USE_PYTHON_VERSION }}

      # Audits the locked dependency set rather than whatever resolves today,
      # so the result describes what this revision actually installs.
      - name: Check dependency advisories
        run: |
          python -m pip install 'pip-audit==2.10.1' 'uv==0.9.9'
          uv export --frozen --no-hashes --all-extras \
            --output-file "$RUNNER_TEMP/locked-requirements.txt"
          python -m pip_audit --strict --requirement \
            "$RUNNER_TEMP/locked-requirements.txt"

      # Pinned version and verified checksum, matching how this repository
      # already fetches Trivy in the docker job.
      - name: Lint the workflows
        run: |
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_dir/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -color

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Preserve independent backend/version evidence if one runner fails.
      fail-fast: false
      max-parallel: 8
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        meridian-backend: ["tensorflow", "jax"]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.python-version }}-${{ matrix.meridian-backend }}
      cancel-in-progress: true
    name: pytest (python-${{ matrix.python-version }}, backend-${{ matrix.meridian-backend }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-meridian
        with:
          python_version: ${{ matrix.python-version }}
      # Bound worker memory on 16 GB runners. Fresh processes release numerical
      # compilation caches between suites. Run fit-heavy suites serially in
      # their own processes so parallel workers cannot retain multiple fits.
      - name: Run core tests
        run: |
          # Keep lightweight resource evidence in the live log even if the
          # hosted runner stops before it can upload an artifact.
          (
            while true; do
              date -u
              free -m
              df -h .
              ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,8p'
              sleep 60
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          # One test-selection mechanism. `run_tests.py` now partitions
          # scripts/ alongside meridian/ and scenarioplanner/, and
          # scripts/test_phase_coverage.py fails the build if any test file
          # under those roots is claimed by no phase. The hand-maintained
          # module list that used to sit here could not catch a new file.
          python scripts/run_tests.py
        env:
          MERIDIAN_BACKEND: ${{ matrix.meridian-backend }}

      - name: Compile report stylesheet
        run: python scripts/compile_report_css.py

      # Catches a shadowed or duplicate install, a stale egg-info and a
      # conflicting accelerator plugin. It ran only from scripts/setup.sh
      # before, so CI never exercised it.
      - name: Verify the environment is usable
        if: matrix.python-version == '3.11' && matrix.meridian-backend == 'jax'
        run: python scripts/verify_environment.py
        env:
          MERIDIAN_BACKEND: jax

      - name: Test local MLflow service integration
        if: matrix.python-version == '3.11' && matrix.meridian-backend == 'jax'
        run: python scripts/test_mlflow_integration.py
        env:
          MERIDIAN_BACKEND: jax
          MLFLOW_DISABLE_AGENT_HINT: '1'

      - name: Run end-to-end smoke test
        run: python scripts/test_end_to_end.py --output-dir "$RUNNER_TEMP/meridian-e2e"
        env:
          MERIDIAN_BACKEND: ${{ matrix.meridian-backend }}

      - name: Install browser smoke-test dependencies
        if: matrix.python-version == '3.11' && matrix.meridian-backend == 'jax'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run report browser smoke test
        if: matrix.python-version == '3.11' && matrix.meridian-backend == 'jax'
        run: python scripts/test_report_browser.py "$RUNNER_TEMP/meridian-e2e/summary.html"

  # Build the image from the same checkout that passed the Python gates, then
  # exercise the runtime as its non-root user. This catches Docker context,
  # editable-install and filesystem ownership regressions that host CI cannot.
  docker:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build runtime image
        run: docker build --tag meridian:ci .

      - name: Scan container OS packages
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          scanner_dir="$RUNNER_TEMP/trivy"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output "$scanner_dir/trivy.tar.gz"
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  $scanner_dir/trivy.tar.gz" | sha256sum --check -
          tar -xzf "$scanner_dir/trivy.tar.gz" -C "$scanner_dir" trivy
          "$scanner_dir/trivy" image --scanners vuln --pkg-types os \
            --ignorefile /dev/null --ignore-unfixed=false --format json \
            --output "$RUNNER_TEMP/container-os-advisories.json" meridian:ci
          # Retain all findings above; block on high/critical findings for
          # which the vendor provides a fix. Unfixed findings stay visible.
          "$scanner_dir/trivy" image --scanners vuln --pkg-types os \
            --ignorefile /dev/null --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 meridian:ci

      - name: Retain complete container OS advisory report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-os-advisories
          path: ${{ runner.temp }}/container-os-advisories.json

      - name: Smoke test runtime user and imports
        run: |
          docker run --rm --entrypoint python meridian:ci -c '
          import getpass
          from pathlib import Path
          assert getpass.getuser() == "meridian", getpass.getuser()
          # Match the default examples/quickstart.py output path so ownership
          # regressions fail before the longer model smoke begins.
          output = Path("/app/quickstart_output")
          output.mkdir()
          (output / "write-check").write_text("ok")
          import meridian
          import scenarioplanner
          print(f"runtime user: {getpass.getuser()}")
          print(f"meridian: {meridian.__version__}")
          print(f"scenarioplanner: {scenarioplanner.__name__}")
          '

      - name: Run model to report smoke test
        run: docker run --rm --env MERIDIAN_BACKEND=jax --entrypoint python meridian:ci scripts/test_end_to_end.py
