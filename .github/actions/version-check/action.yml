# NOTICE: This file was modified from the original google/meridian source.
# See the NOTICE file at the repository root for details.
#
# Check if the current `meridian.__version__` semver has been incremented. If so,
# set a `new_version` output.

name: Check version
description: Detect a semantic version increment, including a first release.

inputs:
  python_version:
    description: The Python version of the build toolchain to use.
    required: true
  semver_prefix:
    description: The prefix of the package version.
    required: true
  current_version:
    description: The current package version.
    required: true

outputs:
  new_version:
    description: The new version if Meridian's semver was incremented, otherwise an empty string.
    value: ${{ steps.version_check.outputs.new_version }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Important: fetch all tags for comparison
        fetch-tags: true
    - shell: bash
      run: pip install semver
    - id: version_check
      name: Check Version
      shell: bash
      # This relies on the git repository having "{prefix}{major}.{minor}.{patch}"
      # named tags. The helper also handles the first release, when no matching
      # tag exists yet.
      env:
        CURRENT_VERSION: ${{ inputs.current_version }}
        SEMVER_PREFIX: ${{ inputs.semver_prefix }}
        PYTHON_BIN: python3
      run: bash "$GITHUB_ACTION_PATH/check_version.sh"
