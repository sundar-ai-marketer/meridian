name: Read schema version
description: Read the schema distribution version from its project metadata.

inputs:
  python_version:
    description: The Python version of the build toolchain to use.
    required: true

outputs:
  value:
    description: The current version of mmm-proto-schema
    value: ${{ steps.get_version.outputs.value }}

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0  # Important: fetch all tags for comparison
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Get version
      id: get_version
      shell: bash
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        import tomllib

        metadata = tomllib.loads(Path('proto/pyproject.toml').read_text())
        version = metadata['project']['version']
        if not isinstance(version, str) or not version or '\n' in version:
            raise ValueError('project.version must be a nonempty single-line string')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'value={version}\n')
        print(version)
        PY
