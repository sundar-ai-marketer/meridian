name: Build distributions
description: Build and upload the wheel and source distribution.

inputs:
  python_version:
    description: The Python version of the build toolchain to use.
    required: true
    default: 3.11
  working_directory:
    description: The working directory to build the package in.
    required: false
    default: .
  output_path:
    description: The path to the output directory.
    required: false
    default: dist/
  artifact_name:
    description: The name for the uploaded build artifact.
    required: true
    default: python-package-distributions

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python_version }}
    - name: Install pypa/build
      shell: bash
      run: python3 -m pip install build --user
    - name: Build a binary wheel and a source tarball
      shell: bash
      run: python3 -m build
      working-directory: ${{ inputs.working_directory }}
    - name: Store the distribution packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.output_path }}
