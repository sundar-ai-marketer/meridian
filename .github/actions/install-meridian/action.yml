# NOTICE: This file was modified from the original google/meridian source.
# See the NOTICE file at the repository root for details.
# Assumes that the local repo is already fetched.

name: Install Meridian
description: Install the local schema and checkout from the audited universal lock.

inputs:
  python_version:
    description: The Python version of the build toolchain to use.
    required: true
    default: 3.11
  extras:
    description: Optional dependencies to install, in the format '[extra1,extra2]'.
    required: false
    default: '[dev,colab,mlflow,schema,scenarioplanner,geox]'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python_version }}
        cache: pip
        cache-dependency-path: uv.lock
    - shell: bash
      env:
        MERIDIAN_EXTRAS: ${{ inputs.extras }}
      run: |
        python -m pip install 'uv==0.11.14'
        environment="$RUNNER_TEMP/meridian-ci"
        python -m venv "$environment"
        uv lock --check
        extra_args=(--extra schema)
        extras="${MERIDIAN_EXTRAS#[}"
        extras="${extras%]}"
        IFS=',' read -r -a selected_extras <<< "$extras"
        for extra in "${selected_extras[@]}"; do
          extra="${extra//[[:space:]]/}"
          [ -z "$extra" ] && continue
          [[ "$extra" =~ ^[a-zA-Z0-9_-]+$ ]] || exit 1
          extra_args+=(--extra "$extra")
        done
        UV_PROJECT_ENVIRONMENT="$environment" uv sync \
          --python "$environment/bin/python" --frozen --no-default-groups \
          "${extra_args[@]}"
        "$environment/bin/python" -m ensurepip --upgrade
        "$environment/bin/python" -m pip check
        "$environment/bin/python" -m pip freeze
        echo "$environment/bin" >> "$GITHUB_PATH"
