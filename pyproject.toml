# NOTICE: This file was modified from the original google/meridian source.
# See the NOTICE file at the repository root for details.

[project]
# Project metadata. Available keys are documented at:
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata
# NOT `google-meridian`. That distribution name belongs to Google and this is
# an unaffiliated fork; uploading under it would misrepresent authorship. The
# import path stays `meridian`, so `import meridian` is unchanged either way.
# Confirm this name is still free on PyPI before the first upload.
name = "meridian-mmm-fork"
description = """\
  Unaffiliated fork of Google's Meridian marketing mix modeling library, with \
  fixes for open upstream issues and added model-validation diagnostics. \
  """
readme = "README.md"
# 3.10 is not supported: `scripts/verify_environment.py` fails it, CI does not
# test it, and `scripts/setup.sh` will not select it.
requires-python = ">=3.11"
# Apache 2.0 section 4(d) requires redistributions to carry the NOTICE file.
# Without it here, neither the wheel nor the sdist contains one.
license-files = ["LICENSE", "NOTICE", "meridian/templates/assets/*LICENSE.txt"]
authors = [
  {name = "The Meridian Authors", email="no-reply@google.com"},
]
maintainers = [
  {name = "Sundar Ramesh Kumar"},
]
classifiers = [  # List of https://pypi.org/classifiers/
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Other/Nonlisted Topic",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = [
  "mmm",
]
# pip dependencies of the project
# Installed locally with `pip install -e .`
dependencies = [
  "arviz < 0.20.0",
  # Upper bound added by this fork: `>= 5` alone lets a future major
  # version install with no CI gate. Tested against 6.3.0.
  "altair >= 5, < 7",
  "babel",
  "bidict",
  "immutabledict",
  "jax >= 0.7.2, < 1.0.0",
  "jaxlib >= 0.7.2, < 1.0.0",
  "joblib",
  # Not imported by this package directly -- it is arviz's dependency, and
  # the ceiling is deliberate: matplotlib 3.11 breaks arviz's import
  # (upstream CHANGELOG 1.7.0). Do not "prune" it as unused.
  "matplotlib < 3.11.0",
  "natsort >= 7.1.1, < 8",
  "numpy >= 2.0.2, < 2.4.0",
  "pandas>=2.2.2,<4",
  "scipy >= 1.13.1, < 2",
  "statsmodels >= 0.14.5, < 0.15",
  "tensorflow >= 2.21.0, < 2.22",
  "tfp-nightly[substrates-jax] == 0.26.0.dev20260130",
  "tf-keras >= 2.21.0, < 2.22",
  "xarray",
]
# `version` is automatically set by flit to use `meridian.__version__`
dynamic = ["version"]

[project.urls]
# Fork support and source URLs; upstream documentation remains linked separately.
homepage = "https://github.com/sundar-ai-marketer/meridian"
repository = "https://github.com/sundar-ai-marketer/meridian"
issues = "https://github.com/sundar-ai-marketer/meridian/issues"
changelog = "https://github.com/sundar-ai-marketer/meridian/blob/main/CHANGELOG.md"
upstream = "https://github.com/google/meridian"
documentation = "https://developers.google.com/meridian"

[project.optional-dependencies]
# Development deps (unittest, linting, formating,...)
# Installed through `pip install -e .[dev]`
dev = [
  # Keep the installer seeded by venv inside the audited tooling contract.
  "pip==26.2.1",
  "pytest>=8.0.0",
  "pytest-xdist",
  "pylint>=2.6.0",
  "pyink",
  # Needed by scripts/compile_report_css.py. An editable install skips the
  # `compile_scss` build command, so the report stylesheet has to be built
  # separately or every generated report comes out unstyled.
  "libsass",
]
# Colab deps
# Installed through `pip install -e .[colab]`
colab = [
  "psutil",
  "python-calamine",  # For parsing the included simulated .xlsx files.
]

# GPU deps
# Installed through `pip install -e .[and-cuda]`
and-cuda = [
  "tensorflow[and-cuda] >= 2.21.0, < 2.22",
  "jax[cuda12] >= 0.7.2, < 1.0.0",
]

# MLflow deps
# Installed through `pip install -e .[mlflow]`
mlflow = ["mlflow"]

# JAX backend dependencies.
# Installed through `pip install -e .[jax]`
jax = [
  "jax >= 0.7.2, < 1.0.0",
  "jaxlib >= 0.7.2, < 1.0.0",
  "tfp-nightly[substrates-jax] == 0.26.0.dev20260130",
]

# MMM proto schema.
schema = [
  "mmm-proto-schema >= 1.3.1",
  "semver",
]

# Meridian Scenario Planner.
scenarioplanner = [
  "google-api-python-client",
  "google-auth",
  "mmm-proto-schema >= 1.3.1",
  "semver",
]

# Meridian GeoX.
geox = [
  "meridian-geox >= 0.1.1"
]

[tool.pyink]
# Formatting configuration to follow Google style-guide
target-version = ["py311"]
line-length = 80
preview = true
pyink-indentation = 2
pyink-use-majority-quotes = true

[build-system]
# Build system specify which backend is used to build/install the project (flit,
# poetry, setuptools,...). All backends are supported by `pip install`
requires = [
  "setuptools >= 77.0.3",
  "libsass",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
py-modules = ["schema"]  # TODO: Remove this shim.

[tool.setuptools.packages.find]
include = ["meridian*", "scenarioplanner*"]
exclude = ["*test"]

[tool.setuptools.dynamic]
version = {attr = "meridian.version.__version__"}

# uv-only source override for the checkout's sibling schema package. This is
# intentionally kept out of published metadata: pip and package consumers
# continue to see the declared `mmm-proto-schema` requirement, while the
# repository's frozen uv workflow always installs the matching local source.
[tool.uv]
# Build isolation is separate from the runtime lock. Keep the build backend
# and the proto compiler deterministic as well; these constraints apply when
# uv builds either this project or the local `proto` source.
build-constraint-dependencies = [
  "grpcio-tools==1.69.0",
  "libsass==0.23.0",
  "setuptools==84.0.0",
]

[tool.uv.sources]
mmm-proto-schema = { path = "proto", editable = true }
